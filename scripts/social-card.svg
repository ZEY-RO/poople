<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Poople — free word ladder game</title>
  <desc id="description">A two-move word ladder: POLL to POOL to POOP. The third letter changes on the first move, and the fourth letter changes on the second move. Play daily, unlimited, timed, bot, and campaign puzzles at poople.site.</desc>
  <defs>
    <filter id="card-shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#203c33" flood-opacity="0.05"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#f6f7f2"/>
  <rect x="24" y="24" width="1152" height="582" rx="30" fill="none" stroke="#dfe5da"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#203c33">
    <text x="72" y="145" font-size="78" font-weight="800" letter-spacing="-4">poople<tspan fill="#276b53">.</tspan></text>
    <text x="74" y="222" font-family="Georgia, 'Times New Roman', serif" font-size="43" letter-spacing="-1">Free word ladder game</text>

    <text x="76" y="303" font-size="26" fill="#52645b">Change one letter at a time.</text>
    <text x="76" y="341" font-size="26" fill="#52645b">Find your way to POOP.</text>

    <rect x="76" y="393" width="310" height="56" rx="14" fill="#e8f2e8"/>
    <circle cx="102" cy="421" r="5" fill="#276b53"/>
    <text x="121" y="429" font-size="23" font-weight="600" fill="#276b53">Four letters. Your path.</text>

    <rect x="650" y="76" width="478" height="440" rx="28" fill="#fff" stroke="#dfe5da" filter="url(#card-shadow)"/>
    <text x="685" y="126" font-size="22" font-weight="600">A two-move ladder</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.2" fill="#5d6e63">
    <text x="674" y="207">START</text>
    <text x="674" y="325">STEP 1</text>
    <text x="674" y="443">GOAL</text>
  </g>

  <!-- POLL → POOL → POOP is checked against Poople's game dictionary. -->
  <g stroke-width="1.5">
    <g fill="#eaf0e5" stroke="#d4dfca">
      <rect x="750" y="160" width="72" height="72" rx="12"/>
      <rect x="832" y="160" width="72" height="72" rx="12"/>
      <rect x="914" y="160" width="72" height="72" rx="12"/>
      <rect x="996" y="160" width="72" height="72" rx="12"/>
    </g>
    <g fill="#f7f8f4" stroke="#dfe5da">
      <rect x="750" y="278" width="72" height="72" rx="12"/>
      <rect x="832" y="278" width="72" height="72" rx="12"/>
      <rect x="996" y="278" width="72" height="72" rx="12"/>
      <rect x="750" y="396" width="72" height="72" rx="12"/>
      <rect x="832" y="396" width="72" height="72" rx="12"/>
      <rect x="914" y="396" width="72" height="72" rx="12"/>
    </g>
    <g fill="#276b53" stroke="#1c513f">
      <rect x="914" y="278" width="72" height="72" rx="12"/>
      <rect x="996" y="396" width="72" height="72" rx="12"/>
    </g>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="middle" fill="#284f3e">
    <text x="786" y="210">P</text><text x="868" y="210">O</text><text x="950" y="210">L</text><text x="1032" y="210">L</text>
    <text x="786" y="328">P</text><text x="868" y="328">O</text><text x="950" y="328" fill="#fff">O</text><text x="1032" y="328">L</text>
    <text x="786" y="446">P</text><text x="868" y="446">O</text><text x="950" y="446">O</text><text x="1032" y="446" fill="#fff">P</text>
  </g>

  <g fill="none" stroke="#aabaaa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M909 244v20m-5-5 5 5 5-5"/>
    <path d="M909 362v20m-5-5 5 5 5-5"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="76" y="557" font-size="22" font-weight="600" fill="#203c33">Daily · Unlimited · Rush · Versus bot · 50-stage campaign</text>
    <text x="76" y="591" font-size="19" fill="#5d6e63">Free to play. No account needed.</text>
    <text x="1128" y="591" font-size="22" font-weight="700" text-anchor="end" fill="#276b53">poople.site</text>
  </g>
</svg>
